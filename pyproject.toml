[project]
authors = [{name = "Lev Kozlov", email = "kozlov.l.a10@gmail.com"}]
name = "frankapy"
requires-python = ">= 3.9"
version = "0.1.0"
dependencies = ["numpy", "matplotlib", "autolab-core>=1.1.1,<2", "numpy-quaternion>=2023.0.4,<2024", "empy", "catkin-tools>=0.9.5,<0.10", "scipy"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "robostack-staging"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
frankapy = { path = ".", editable = true }

[tool.pixi.tasks]
build = """bash bash_scripts/make_libfranka.sh && \
    cd ros2_ws && colcon build --symlink-install --cmake-args \
        -DPython_EXECUTABLE=$CONDA_PREFIX/bin/python \
        -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python \
        -DPYTHON_EXECUTABLE=$CONDA_PREFIX/bin/python \
        -DPython3_FIND_STRATEGY=LOCATION \
        -DPython_FIND_STRATEGY=LOCATION 
"""

[tool.pixi.dependencies]
cxx-compiler = ">=1.9.0,<2"
cmake = "<4.0.0"
pkg-config = ">=0.29.2,<0.30"

ros-humble-desktop = ">=0.10.0,<0.11"
protobuf = ">=5.29.3,<6"
ros-humble-franka-ros2 = ">=1.0.0,<2"
pinocchio = ">=3.7.0,<4"
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = ">=80.9.0,<81"
compilers = ">=1.11.0,<2"
make = ">=4.4.1,<5"
ninja = ">=1.12.1,<2"
python = ">=3.11,<3.12"
catkin_tools = ">=0.9.5,<0.10"
rosdep = ">=0.26.0,<0.27"
numpy = "*"
ros-humble-ament-cmake-clang-format = ">=0.12.12,<0.13"
libprotobuf = ">=5.29.3,<6"
ros-humble-diagnostic-updater = ">=4.0.6,<5"
numba = ">=0.61.2,<0.62"
cuda-nvcc = ">=12,<13"
cuda-nvrtc = ">=12,<13"


[tool.pixi.activation]
scripts = ["catkin_ws/devel/setup.sh"]
